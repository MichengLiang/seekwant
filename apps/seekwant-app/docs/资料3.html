<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTGO 外卖平台 - 服务架构全景图</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #0f172a; color: #f1f5f9; }
        svg { cursor: grab; }
        svg:active { cursor: grabbing; }

        .node circle { stroke: #fff; stroke-width: 2px; filter: drop-shadow(0 0 10px rgba(0,0,0,0.3)); }
        .node text {
            font-size: 11px; font-weight: 600; fill: #e2e8f0; pointer-events: none;
            paint-order: stroke fill; stroke: #0f172a; stroke-width: 4px; stroke-linejoin: round;
        }

        .link { stroke: #475569; stroke-opacity: 0.4; transition: stroke 0.3s; }
        .link.hovered { stroke: #38bdf8; stroke-width: 2px; stroke-opacity: 1; }

        .link-label {
            font-size: 10px; fill: #94a3b8; pointer-events: none;
            paint-order: stroke fill; stroke: #0f172a; stroke-width: 4px; stroke-linejoin: round;
        }
        .link-label.hovered { fill: #38bdf8; font-weight: bold; }

        .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="flex h-screen w-screen">

    <aside class="w-80 h-full glass-panel z-10 flex flex-col p-6 shadow-2xl shrink-0">
        <h1 class="text-lg font-bold text-white mb-2">FTGO 架构依赖图谱</h1>
        <p class="text-xs text-slate-400 mb-6 leading-relaxed">
            基于 RDF 语义数据定义的微服务架构。系统自动解耦物理约束，优化了高密度服务间的连线与文字避让。
        </p>
        
        <div id="legend" class="space-y-3"></div>

        <div class="mt-auto pt-6 border-t border-slate-700">
            <button id="reset" class="w-full bg-slate-700 hover:bg-slate-600 text-white py-2 rounded-lg text-sm transition">重置力场布局</button>
        </div>
    </aside>

    <main class="flex-1 relative">
        <svg id="canvas" class="w-full h-full"></svg>
    </main>

    <script>
        const layers = {
            "入口": "#38bdf8", "业务": "#fb923c", "支撑": "#4ade80", "基础设施": "#c084fc"
        };

        const data = {
            nodes: [
                {id: "api-gateway", label: "API 网关", layer: "入口"},
                {id: "auth-service", label: "认证服务", layer: "入口"},
                {id: "user-service", label: "用户服务", layer: "业务"},
                {id: "restaurant-service", label: "餐厅服务", layer: "业务"},
                {id: "order-service", label: "订单服务", layer: "业务"},
                {id: "payment-service", label: "支付服务", layer: "业务"},
                {id: "delivery-service", label: "配送服务", layer: "业务"},
                {id: "notification-service", label: "通知服务", layer: "支撑"},
                {id: "user-db", label: "用户DB", layer: "基础设施"},
                {id: "restaurant-db", label: "餐厅DB", layer: "基础设施"},
                {id: "order-db", label: "订单DB", layer: "基础设施"},
                {id: "payment-db", label: "支付DB", layer: "基础设施"},
                {id: "notification-db", label: "通知DB", layer: "基础设施"},
                {id: "redis", label: "Redis", layer: "基础设施"},
                {id: "message-queue", label: "消息队列", layer: "基础设施"}
            ],
            links: [
                {source: "api-gateway", target: "user-service", label: "路由"},
                {source: "api-gateway", target: "order-service", label: "路由"},
                {source: "api-gateway", target: "restaurant-service", label: "路由"},
                {source: "api-gateway", target: "delivery-service", label: "路由"},
                {source: "api-gateway", target: "auth-service", label: "依赖"},
                {source: "api-gateway", target: "redis", label: "依赖"},
                {source: "auth-service", target: "redis", label: "依赖"},
                {source: "user-service", target: "auth-service", label: "委托"},
                {source: "user-service", target: "user-db", label: "依赖"},
                {source: "user-service", target: "redis", label: "依赖"},
                {source: "user-service", target: "message-queue", label: "发布"},
                {source: "user-service", target: "notification-service", label: "订阅"},
                {source: "restaurant-service", target: "restaurant-db", label: "依赖"},
                {source: "restaurant-service", target: "redis", label: "依赖"},
                {source: "restaurant-service", target: "order-service", label: "查询"},
                {source: "restaurant-service", target: "message-queue", label: "发布"},
                {source: "order-service", target: "order-db", label: "依赖"},
                {source: "order-service", target: "message-queue", label: "发布"},
                {source: "order-service", target: "restaurant-service", label: "查询"},
                {source: "order-service", target: "user-service", label: "查询"},
                {source: "order-service", target: "payment-service", label: "查询"},
                {source: "payment-service", target: "payment-db", label: "依赖"},
                {source: "payment-service", target: "message-queue", label: "发布"},
                {source: "payment-service", target: "order-service", label: "订阅"},
                {source: "delivery-service", target: "redis", label: "依赖"},
                {source: "delivery-service", target: "user-service", label: "查询"},
                {source: "delivery-service", target: "restaurant-service", label: "查询"},
                {source: "delivery-service", target: "message-queue", label: "发布"},
                {source: "delivery-service", target: "notification-service", label: "订阅"},
                {source: "notification-service", target: "notification-db", label: "依赖"}
            ]
        };

        const legend = d3.select("#legend");
        Object.entries(layers).forEach(([k, v]) => {
            legend.append("div").html(`<div class="flex items-center gap-2 text-xs"><div class="w-3 h-3 rounded-full" style="background:${v}"></div>${k}</div>`);
        });

        const svg = d3.select("#canvas").attr("viewBox", [0, 0, 800, 600]);
        const g = svg.append("g");

        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(100).strength(0.5))
            .force("charge", d3.forceManyBody().strength(-800))
            .force("center", d3.forceCenter(400, 300))
            .force("collide", d3.forceCollide(40).iterations(8));

        const link = g.append("g").selectAll("line").data(data.links).enter().append("line")
            .attr("class", "link").attr("marker-end", "url(#arrowhead)");
            
        const linkLabel = g.append("g").selectAll("text").data(data.links).enter().append("text")
            .attr("class", "link-label").text(d => d.label);

        const node = g.append("g").selectAll("g").data(data.nodes).enter().append("g")
            .attr("class", "node")
            .call(d3.drag().on("start", (e, d) => { if(!e.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
                           .on("drag", (e, d) => { d.fx=e.x; d.fy=e.y; })
                           .on("end", (e, d) => { if(!e.active) simulation.alphaTarget(0); d.fx=null; d.fy=null; }));

        node.append("circle").attr("r", 25).attr("fill", d => layers[d.layer]);
        node.append("text").attr("text-anchor", "middle").text(d => d.label);

        svg.append("defs").append("marker").attr("id", "arrowhead").attr("viewBox", "0 -5 10 10").attr("refX", 32).attr("markerWidth", 6).attr("markerHeight", 6).attr("orient", "auto")
            .append("path").attr("fill", "#475569").attr("d", "M0,-4L10,0L0,4");

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            linkLabel.attr("x", d => (d.source.x + d.target.x) / 2).attr("y", d => (d.source.y + d.target.y) / 2);
            node.attr("transform", d => `translate(${d.x},${d.y})`);
        });

        document.getElementById("reset").onclick = () => { simulation.alpha(1).restart(); };
    </script>
</body>
</html>
